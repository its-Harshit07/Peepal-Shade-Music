<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Peepal Shade - 90s Indian Nostalgia</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Fullscreen Background Image Wrapper -->
  <div class="bg-wrapper">
    <picture class="bg-picture">
      <source media="(max-aspect-ratio: 1/1), (max-width: 600px)" srcset="background_mobile.webp">
      <img src="background.webp" alt="Background" class="bg-image" id="bg-img">
    </picture>
    <!-- Radio Music Note Emitter Overlay -->
    <div class="radio-emitter-overlay" id="radio-emitter"></div>
  </div>

  <!-- Dedicated YouTube Player Container (Hidden Off-Screen Engine) -->
  <div class="yt-player-wrap" id="yt-player-wrap">
    <div id="youtube-player"></div>
  </div>

  <!-- Live Visitor Count (Top Left) -->
  <div class="visitor-count-container" id="visitor-count-container">
    <span class="online-indicator"></span>
    <span id="visitor-count-text">1 person is here rn.</span>
  </div>

  <!-- Live Clock (Top Right) -->
  <div class="clock-container" id="clock-container">
    <span id="clock-main">00:00</span>
    <span id="clock-sec">00</span>
  </div>

  <!-- Broader Custom Music Player Container (Middle of Tree Trunk) -->
  <div class="tree-trunk-player" id="music-player">
    <div class="player-cover" id="player-cover">
      <img src="" alt="Artwork" id="cover-img" class="cover-img hidden">
      <div class="artwork-placeholder" id="artwork-placeholder">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>
    </div>

    <div class="player-content">
      <div class="track-header">
        <span class="track-title" id="track-title">Loading track...</span>
        <span class="track-number" id="track-number">Track -- / --</span>
      </div>

      <div class="track-sub">
        <span class="track-artist" id="track-artist">Loading artist...</span>
        <a id="track-publisher" class="track-publisher" href="#" target="_blank" rel="noopener noreferrer" title="View Source Channel on YouTube">
          Source ↗
        </a>
      </div>

      <div class="player-timeline">
        <span class="time-current" id="time-current">0:00</span>
        <div class="progress-bar-container" id="progress-container" title="Click to seek">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <span class="time-total" id="time-total">0:00</span>
      </div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" id="btn-prev" title="Previous Song">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>

      <button class="ctrl-btn play-btn" id="btn-play" title="Play/Pause">
        <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg class="icon-pause hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>

      <button class="ctrl-btn" id="btn-next" title="Next Song">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>

      <button class="ctrl-btn" id="btn-library" title="Track Library">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Track Library Overlay Drawer Container -->
  <div class="library-overlay hidden" id="library-overlay">
    <div class="library-backdrop" id="library-backdrop"></div>
    <div class="library-panel">
      <div class="library-header">
        <div class="library-title-group">
          <h2 class="library-title">Music Library</h2>
          <span class="library-badge" id="library-badge">0 Songs</span>
        </div>
        <button class="library-close-btn" id="btn-close-library" title="Close Library">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Category Tabs -->
      <div class="library-tabs" id="library-tabs">
        <button class="tab-btn active" data-category="90s">90s</button>
        <button class="tab-btn" data-category="Nostalgic">Nostalgic</button>
        <button class="tab-btn" data-category="Bhojpuri">Bhojpuri</button>
        <button class="tab-btn" data-category="Trends">Trends</button>
      </div>

      <!-- Search Bar -->
      <div class="library-search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="library-search-input" id="library-search-input" placeholder="Search songs, artists..." autocomplete="off">
        <button class="search-clear-btn hidden" id="btn-clear-search" title="Clear Search">✕</button>
      </div>

      <!-- Compact Scrollable Song List -->
      <div class="library-song-list" id="library-song-list">
        <!-- Songs rendered dynamically -->
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
